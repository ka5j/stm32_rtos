# OpenOCD config - NUCLEO-F446RE (onboard ST-LINK/V2-1, STM32F446RE target)

# Debug adapter: the Nucleo board's built-in ST-LINK
source [find interface/stlink.cfg]

# ST-LINK/V2-1 on Nucleo boards talks SWD, not full JTAG
transport select hla_swd

# Target chip family - covers the F446RE
source [find target/stm32f4x.cfg]