name: CodeQL

# GitHub CodeQL static analysis. Builds both the firmware (cross-compiled)
# and the host tests, so CodeQL sees every source in both forms. main and
# develop require the Analyze (c-cpp) job.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Arm GNU Toolchain 15.2.rel1 (arm-none-eabi)
        uses: ./.github/actions/setup-arm-toolchain

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: c-cpp

      - name: Build firmware and host-side tests
        run: |
          make all
          make test

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:c-cpp"
