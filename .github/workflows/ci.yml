name: CI

# The merge gate: build, test, coverage, lint, docs and version checks.
# main and develop require the build-and-check job. No hardware is involved;
# see SECURITY.md.
#
# push is limited to main/develop so a feature branch with an open PR is not
# built twice. Do not add a cancel-in-progress concurrency group to dedupe
# runs: a cancelled run's result can stick to the commit and leave the
# required check BLOCKED even after a later run passes.
on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-24.04
    # A hung download fails the check instead of holding it pending for hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes
          fetch-depth: 0 # the PR file checks diff against the base branch

      - name: Set up Arm GNU Toolchain 15.2.rel1 (arm-none-eabi)
        uses: ./.github/actions/setup-arm-toolchain

      - name: Install cppcheck / clang-format (pinned to Ubuntu 24.04 archive versions)
        # Pinned so an archive update fails loudly instead of quietly changing
        # the MISRA or formatting rules CI enforces. Bump deliberately.
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y cppcheck=2.13.0-2ubuntu3 clang-format=1:18.0-59~exp2

      - name: Set up Doxygen 1.18.0 and Graphviz
        uses: ./.github/actions/setup-doxygen

      - name: make all
        run: make all

      # Some warnings only appear with optimisation; catch them before a release does.
      - name: make all BUILD=release
        run: make all BUILD=release

      # Built so it cannot rot; it runs only on a board (see tests/target/smoke.c).
      - name: make smoke (debug and release)
        run: make smoke && make smoke BUILD=release

      - name: make format-check
        run: make format-check

      - name: make test
        run: make test

      - name: make test SANITIZE=1
        run: make test SANITIZE=1

      - name: Set up Python 3.12
        # Pinned so a runner image update cannot change the interpreter the
        # Python tools run on.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install gcovr (hash-locked, tools/ci/requirements.txt)
        # Every package, gcovr's dependencies included, is pinned with its
        # hashes, so no upstream release can change the coverage gate.
        run: |
          python -m venv "$RUNNER_TEMP/ci-venv"
          "$RUNNER_TEMP/ci-venv/bin/pip" install --require-hashes -r tools/ci/requirements.txt
          echo "$RUNNER_TEMP/ci-venv/bin" >> "$GITHUB_PATH"

      - name: make coverage
        run: make coverage

      - name: make lint
        run: make lint

      - name: make docs
        run: make docs

      - name: make check-version
        run: make check-version

      - name: Check touched files have @file blocks and unit tests
        # PR-only: it needs a base branch to diff against. See CONTRIBUTING.md.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE_REF"
          make check-pr BASE="origin/$BASE_REF"
