name: CI

# Public-facing gate: build + docs + format + lint, on a GitHub-hosted
# runner. Runs on every push and PR - this is the badge/status a reviewer
# sees. Hardware-in-the-loop testing lives in hil.yml on a self-hosted
# runner instead, deliberately not triggered here (see that file for why).
on:
  push:
  pull_request:

# Least-privilege default: this workflow only ever reads the repo and
# runs local build/lint/test/docs commands - it never needs to write
# anything back to GitHub.
permissions:
  contents: read

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # full history - required to diff PR head against its base branch below

      - name: Install Arm GNU Toolchain 15.2.rel1 (arm-none-eabi)
        # Ubuntu's gcc-arm-none-eabi apt package trails upstream by years,
        # and even an apt install of the "right" package name can silently
        # change compiler build out from under this workflow whenever the
        # archive updates it - the compiler is the most consequential tool
        # in this whole pipeline (codegen, not just tooling output), so it
        # gets the same "pin an exact upstream release" treatment as
        # Doxygen below, not a floating apt package.
        run: |
          curl -sSL https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz \
            | tar -xJ -C /opt
          echo "/opt/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi/bin" >> "$GITHUB_PATH"

      - name: Install cppcheck / clang-format (pinned to Ubuntu 24.04 archive versions)
        # apt's usual `install -y cppcheck clang-format` floats to whatever
        # noble's archive currently has - pinning the exact package version
        # means an archive update can only make this step fail loudly
        # (package no longer available at that version) instead of quietly
        # changing which MISRA ruleset or formatting rules CI enforces.
        # Bump these pins deliberately, the same way the Doxygen and Arm
        # toolchain versions above are bumped by hand.
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck=2.13.0-2ubuntu3 clang-format=1:18.0-59~exp2

      - name: Install graphviz (for Doxyfile's HAVE_DOT diagrams)
        # Unpinned, unlike cppcheck/clang-format/Doxygen above: graphviz only
        # draws the include/directory/group graphs `make docs` embeds, it
        # doesn't gate pass/fail on anything, so an archive version bump
        # can't silently change what CI enforces the way a linter or
        # formatter version bump could.
        run: sudo apt-get install -y graphviz

      - name: Install Doxygen 1.18.0
        # Ubuntu's apt package (1.9.8 as of this writing) is far behind the
        # version this Doxyfile targets (see its header comment and
        # docs/groups.dox's @addtogroup usage) - dozens of tags silently
        # ignored, and old-parser quirks can hard-fail under
        # WARN_AS_ERROR=YES that the intended version doesn't hit. Install
        # the exact upstream release instead of trusting the distro package
        # to track it.
        run: |
          curl -sSL https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
            | tar -xz -C /opt
          echo "/opt/doxygen-1.18.0/bin" >> "$GITHUB_PATH"

      - name: make all
        run: make all

      - name: make format-check
        run: make format-check

      - name: make test
        run: make test

      - name: Install gcovr 8.6 (pinned, for make coverage)
        # pip, not apt, since gcovr isn't in Ubuntu's archive at a useful
        # version - pinned the same way cppcheck/clang-format/Doxygen above
        # are, so a gcovr release changing its coverage math or CLI flags
        # can't silently change what this gate enforces. --break-system-
        # packages: Ubuntu 24.04's system pip enforces PEP 668's
        # externally-managed-environment restriction; safe here since this
        # runner VM is discarded after the job, not a persistent system.
        run: pip install --break-system-packages gcovr==8.6

      - name: make coverage
        run: make coverage

      - name: make lint
        run: make lint

      - name: make docs
        run: make docs

      - name: Check touched source files have a Doxygen @file block
        # `make docs` only enforces per-member documentation on a file once
        # it has at least one Doxygen comment (e.g. @file) - a file with
        # zero doc comments is otherwise invisible to that gate. This check
        # closes that gap by requiring @file on every touched source file,
        # which is also what activates the per-member checking in the first
        # place. Same PR-diff approach as the test-coverage check below.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          missing=0

          changed=$(git diff --name-status --diff-filter=AM "$BASE"...HEAD -- \
            'core/inc/*.h' 'device/inc/*.h' \
            'drivers/inc/*.h' 'drivers/src/*.c' \
            'api/inc/*.h' 'api/src/*.c' \
            'bsp/inc/*.h' 'bsp/src/*.c' \
            'rtos/kernel/inc/*.h' 'rtos/kernel/src/*.c' \
            'rtos/api/inc/*.h' 'rtos/api/src/*.c' \
            'app/src/*.c' | awk '{print $2}')
          for f in $changed; do
            if ! grep -q '@file' "$f"; then
              echo "::error file=$f::Missing Doxygen @file block - make docs won't check this file at all without one"
              missing=1
            fi
          done

          exit $missing

      - name: Check new modules have unit tests
        # PR-only: needs the PR's base branch to diff against, which a plain
        # push doesn't have. Runs on every PR regardless of target branch,
        # so this applies to feature->develop and develop->main alike.
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          BASE="origin/${{ github.event.pull_request.base.ref }}"
          missing=0

          # .c files added OR modified under drivers/, api/, bsp/, rtos/ (and
          # app/, except main.c - the entry point, not logic worth a
          # dedicated unit test) need a matching tests/unit/test_<name>.c.
          # Modified (not just added) matters here: several .c files in this
          # repo started as empty scaffolding in the initial commit, so
          # filling one in shows up as a modification, not an addition.
          added_c=$(git diff --name-status --diff-filter=AM "$BASE"...HEAD -- \
            'drivers/*.c' 'api/*.c' 'bsp/*.c' 'rtos/*.c' 'app/*.c' | awk '{print $2}')
          for f in $added_c; do
            if [ "$f" = "app/src/main.c" ]; then
              continue
            fi
            base=$(basename "$f" .c)
            if [ ! -f "tests/unit/test_${base}.c" ]; then
              echo "::error file=$f::New module $f has no matching tests/unit/test_${base}.c"
              missing=1
            fi
          done

          # *_reg.h files added OR modified under core/inc, device/inc
          # (register data, no .c file to match 1:1) must be #include'd by
          # some test.
          added_reg=$(git diff --name-status --diff-filter=AM "$BASE"...HEAD -- \
            'core/inc/*_reg.h' 'device/inc/*_reg.h' | awk '{print $2}')
          for f in $added_reg; do
            base=$(basename "$f")
            if ! grep -rl "\"$base\"" tests/unit/ >/dev/null 2>&1; then
              echo "::error file=$f::New register header $f is not included by any file in tests/unit/"
              missing=1
            fi
          done

          exit $missing
