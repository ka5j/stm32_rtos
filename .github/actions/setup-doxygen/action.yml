name: Set up Doxygen and Graphviz
description: >-
  Install the pinned Doxygen release into /opt (checked against a pinned
  SHA256) and Graphviz, the docs toolchain for `make docs`. Used by ci.yml
  and pages.yml, so the version and checksum live in one place.

runs:
  using: composite
  steps:
    - name: Cache Doxygen 1.18.0
      # The key includes the checksum prefix, so changing the pin invalidates it.
      id: cache-doxygen
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/doxygen-1.18.0
        key: doxygen-1.18.0-linux-bin-14fa81bdc341

    - name: Download, verify and install Doxygen 1.18.0
      # Ubuntu's package (1.9.x) is too old for this Doxyfile. Doxygen
      # publishes no checksum; this is the digest GitHub records for the
      # release asset.
      if: steps.cache-doxygen.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive=doxygen-1.18.0.linux.bin.tar.gz
        sha256=14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
          "https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/$archive"
        echo "$sha256  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C /opt
        rm -f "$RUNNER_TEMP/$archive"

    - name: Add Doxygen to PATH
      shell: bash
      run: echo "/opt/doxygen-1.18.0/bin" >> "$GITHUB_PATH"

    - name: Install Graphviz
      # Without `dot`, Doxygen silently drops every diagram. Unpinned: it only
      # draws, it cannot change what a check enforces.
      shell: bash
      run: |
        sudo apt-get -o Acquire::Retries=3 update
        sudo apt-get -o Acquire::Retries=3 install -y graphviz
