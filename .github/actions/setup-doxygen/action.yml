name: Set up Doxygen
description: >-
  Install the pinned Doxygen release into /opt, verified against a pinned
  SHA256, and add it to PATH. The single place the Doxygen version and
  checksum live - ci.yml and pages.yml both use it. Does not install
  graphviz; the caller does that (apt, needs sudo).

runs:
  using: composite
  steps:
    - name: Cache Doxygen 1.18.0
      # Keyed on the version and the first 12 hex digits of the pinned
      # SHA256 below - see setup-arm-toolchain for why.
      id: cache-doxygen
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /opt/doxygen-1.18.0
        key: doxygen-1.18.0-linux-bin-14fa81bdc341

    - name: Download, verify and install Doxygen 1.18.0
      # Ubuntu's apt package (1.9.8 as of this writing) is far behind the
      # version this Doxyfile targets (see its header comment and
      # docs/groups.dox's @addtogroup usage) - dozens of tags silently
      # ignored, and old-parser quirks can hard-fail under
      # WARN_AS_ERROR=YES that the intended version doesn't hit. Install
      # the exact upstream release instead of trusting the distro package
      # to track it, and check it against a pinned SHA256 before
      # extracting. Doxygen publishes no checksum file; this value is the
      # digest GitHub records for the release asset
      # (gh api repos/doxygen/doxygen/releases/tags/Release_1_18_0).
      if: steps.cache-doxygen.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        archive=doxygen-1.18.0.linux.bin.tar.gz
        sha256=14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
          "https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/$archive"
        echo "$sha256  $RUNNER_TEMP/$archive" | sha256sum -c -
        tar -xzf "$RUNNER_TEMP/$archive" -C /opt
        rm -f "$RUNNER_TEMP/$archive"

    - name: Add Doxygen to PATH
      shell: bash
      run: echo "/opt/doxygen-1.18.0/bin" >> "$GITHUB_PATH"
